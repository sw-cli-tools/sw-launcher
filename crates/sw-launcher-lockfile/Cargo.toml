[package]
name = "sw-launcher-lockfile"
version = "0.1.0"
edition = "2024"
description = "sw-launch.lock writer/reader and drift detection for sw-launcher"
license = "MIT"
repository = "https://github.com/sw-cli-tools/sw-launcher"

[lib]
name = "sw_launcher_lockfile"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
sw-launcher-tool = { path = "../sw-launcher-tool" }

[dev-dependencies]
tempfile = "3"
