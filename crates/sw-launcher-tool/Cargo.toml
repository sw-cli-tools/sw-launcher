[package]
name = "sw-launcher-tool"
version = "0.1.0"
edition = "2024"
description = "Build-tool invocation, content-addressed disk cache, and listing parser for sw-launcher"
license = "MIT"
repository = "https://github.com/sw-cli-tools/sw-launcher"

[lib]
name = "sw_launcher_tool"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"
